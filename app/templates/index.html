<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grok & Regex Debugger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#131e32',
              900: '#0f172a',
              950: '#080d1a',
            }
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 3px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }

    textarea {
      tab-size: 2;
    }

    .results-container {
      transition: max-height 0.3s ease;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-full flex flex-col font-sans antialiased selection:bg-indigo-500 selection:text-white" x-data="grokApp()" x-init="initApp()">
  <div class="max-w-[1800px] w-full mx-auto px-4 py-5 sm:px-6 sm:py-6 lg:px-8 flex-1">
    
    <header class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6 pb-5 border-b border-slate-800/80">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-indigo-600/10 border border-indigo-500/20 rounded-xl text-indigo-400 shrink-0">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2.5">
            <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Grok & Regexp Debugger</h1>
          </div>
          <p class="text-xs text-slate-400 mt-0.5">ECS-compliant log parsing engine with real-time pattern diagnostics</p>
        </div>
      </div>

      <div class="flex items-center justify-between lg:justify-end gap-3 flex-wrap">
        <div class="flex items-center gap-2.5 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg shadow-sm">
          <label class="flex items-center cursor-pointer text-xs font-semibold select-none gap-2">
            <div class="relative flex items-center">
              <input type="checkbox" x-model="liveMode" class="sr-only peer">
              <div class="w-9 h-5 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600 border border-slate-700"></div>
            </div>
            <span class="text-slate-300 font-medium">Live Match:</span>
          </label>

          <span :class="liveMode ? 'bg-indigo-950 text-indigo-300 border-indigo-700/80' : 'bg-slate-800 text-slate-400 border-slate-700'"
                class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md border transition">
            <span x-text="liveMode ? 'Active' : 'Paused'"></span>
          </span>

          <div class="h-4 w-px bg-slate-800 my-auto"></div>

          <button x-show="!liveMode" @click="triggerMatch()" class="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded-md font-semibold text-xs transition shadow-sm shadow-indigo-600/30 flex items-center gap-1.5">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            Run Now
          </button>
        </div>

        <button @click="resetAll()" class="px-3 py-2 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-rose-400 hover:text-rose-300 rounded-lg font-medium text-xs transition flex items-center gap-1.5 shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
          <span class="hidden sm:inline">Reset Workspace</span>
        </button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <!-- Left column -->
      <div class="lg:col-span-5 space-y-5">
        <!-- GROK Pattern -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm space-y-3">
          <div class="flex items-center justify-between gap-2 flex-wrap pb-1">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/></svg>
              GROK / Regex Pattern
            </label>

            <div class="flex items-center gap-3">
              <!-- Match Mode Toggle Button -->
              <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-0.5 text-xs shrink-0">
                <button @click="strictMode = false; saveState(); onInputChange()"
                        :class="!strictMode ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                        class="px-2 py-1 rounded-md transition text-[11px]" title="Flexible match (substring search anywhere in line)">
                  Flexible
                </button>
                <button @click="strictMode = true; saveState(); onInputChange()"
                        :class="strictMode ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                        class="px-2 py-1 rounded-md transition text-[11px]" title="Strict match (requires exact full line match ^...$)">
                  Strict
                </button>
              </div>
              <!-- Replaced Dropdown with Format Toggle Button -->
              <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-0.5 text-xs shrink-0">
                <button @click="setNamingFormat('dot')"
                        :class="namingFormat === 'dot' ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                        class="px-2 py-1 rounded-md transition text-[11px]" title="Dot syntax (client.ip)">
                  Dot Format
                </button>
                <button @click="setNamingFormat('bracket')"
                        :class="namingFormat === 'bracket' ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                        class="px-2 py-1 rounded-md transition text-[11px]" title="ECS Bracket ([client][ip])">
                  ECS Format
                </button>
              </div>
              <button @click="autoGenerate()" class="inline-flex items-center gap-1.5 text-[11px] bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-1 rounded-md transition font-medium">
                <span>Auto-Generate</span>
                <span class="text-[9px] font-bold uppercase tracking-wider bg-amber-500/20 text-amber-300 border border-amber-500/30 px-1 py-0.5 rounded leading-none">
                  Beta
                </span>
              </button>
            </div>
          </div>

          <textarea id="area_pattern" x-model="pattern" @input="onInputChange()"
            class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 font-mono text-xs sm:text-sm text-indigo-200 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 focus:outline-none h-32 leading-relaxed custom-scrollbar resize-y"
            placeholder="<%{INT:[syslog][pri]}>%{SYSLOGTIMESTAMP:[timestamp]}..."></textarea>

          <!-- Syntax Auto-Fix Card (Legacy Regex) -->
          <template x-if="suggestedFix">
            <div class="p-3 bg-amber-950/30 border border-amber-600/30 rounded-lg text-xs text-amber-200/90 flex items-start gap-2.5">
              <svg class="w-4 h-4 text-amber-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <div class="space-y-1.5 flex-1 min-w-0">
                <p class="leading-tight"><strong class="text-amber-300">Syntax Tip:</strong> Capture group <code class="text-amber-200 font-mono bg-amber-950/80 px-1 py-0.5 rounded border border-amber-800/60" x-text="rawMatchText"></code> uses legacy regex syntax.</p>
                <div class="flex items-center gap-2 pt-0.5 flex-wrap">
                  <code class="bg-slate-950 px-2 py-0.5 rounded text-amber-300 border border-slate-800 font-mono text-[11px]" x-text="suggestedFix"></code>
                  <button @click="applyAutoFix()" class="text-[11px] bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold px-2 py-0.5 rounded transition shadow-sm">
                    Convert to Grok
                  </button>
                </div>
              </div>
            </div>
          </template>

          <!-- Mixed Format Normalization Card -->
          <template x-if="inconsistentFields.length > 0">
            <div class="p-3 bg-sky-950/30 border border-sky-600/30 rounded-lg text-xs text-sky-200/90 flex items-start gap-2.5">
              <svg class="w-4 h-4 text-sky-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
              <div class="space-y-1.5 flex-1 min-w-0">
                <p class="leading-tight"><strong class="text-sky-300">Format Mismatch:</strong> Found fields not matching the selected <span class="font-bold" x-text="namingFormat === 'dot' ? 'Dot' : 'ECS Bracket'"></span> format.</p>
                <div class="flex items-center gap-2 pt-0.5 flex-wrap">
                  <span class="text-sky-400/80 text-[10px]">e.g., <code class="text-sky-300 font-mono" x-text="inconsistentFields[0]"></code></span>
                  <button @click="normalizePattern()" class="text-[11px] bg-sky-600 hover:bg-sky-500 text-white font-bold px-2 py-0.5 rounded transition shadow-sm">
                    Normalize Pattern
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- Custom Pattern Definitions -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm space-y-2" id="customPatternsContainer">
          <div class="flex items-center justify-between">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
              <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
              Custom Pattern Definitions
            </label>
          </div>

          <div class="relative bg-slate-950 border border-slate-800 rounded-lg overflow-hidden flex flex-col h-32 resize-y">
            <div class="flex flex-1 min-h-0">
              <div id="custom_gutter" aria-hidden="true"
                   class="w-10 shrink-0 bg-slate-900/80 border-r border-slate-800 py-3 px-1 text-right font-mono text-xs text-slate-600 select-none overflow-y-auto leading-relaxed custom-scrollbar">
                <template x-for="n in customLineCount" :key="n">
                  <div x-text="n"></div>
                </template>
              </div>

              <textarea id="area_custom" x-model="customPatterns"
                @input="onInputChange(); syncResultsHeight()"
                @scroll="syncCustomScroll()"
                class="flex-1 bg-slate-950 py-3 px-3 font-mono text-xs text-slate-200 focus:outline-none leading-relaxed border-0 whitespace-pre resize-none custom-scrollbar"
                style="overflow-wrap: normal; word-break: normal;"
                placeholder="CUSTOM_PATTERN [\w-]+"></textarea>
            </div>
            <div class="h-1 w-full bg-slate-800/50 hover:bg-slate-700/50 cursor-ns-resize shrink-0"></div>
          </div>
        </div>
      </div>

      <!-- Right column: results -->
      <div class="lg:col-span-7 space-y-4">
        <!-- Results header -->
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-3 shadow-sm flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
          <div class="flex items-center gap-2.5 flex-wrap">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Results</span>

            <template x-if="results.length > 0">
              <div class="flex items-center gap-2 text-xs font-mono bg-slate-950 border border-slate-800 px-2.5 py-1 rounded-lg">
                <span class="text-slate-400">Match:</span>
                <span class="font-bold text-emerald-400" x-text="matchedCount"></span>
                <span class="text-slate-600">/</span>
                <span class="font-bold text-slate-300" x-text="results.length"></span>

                <button @click="showUnmatchedOnly = !showUnmatchedOnly; saveState()"
                        :class="showUnmatchedOnly ? 'bg-rose-950 text-rose-300 border-rose-800/80' : 'bg-slate-900 text-slate-400 border-slate-800 hover:text-slate-200'"
                        class="ml-1 px-2 py-0.5 rounded text-[11px] font-medium border transition">
                  <span x-text="showUnmatchedOnly ? 'Unmatched Only' : 'Show All'"></span>
                </button>
              </div>
            </template>
          </div>

          <div class="flex items-center gap-2 flex-wrap sm:flex-nowrap">
            <div class="relative flex-1 sm:w-44">
              <input type="text"
                     x-model="searchQuery"
                     placeholder="Search results..."
                     class="w-full bg-slate-950 border border-slate-800 text-xs text-slate-200 placeholder-slate-500 rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-indigo-500 pl-7">
              <svg class="w-3.5 h-3.5 text-slate-500 absolute left-2.5 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a5 5 0 11-14 0 5 5 0 0114 0z"/>
              </svg>
              <button x-show="searchQuery" @click="searchQuery = ''" class="absolute right-2 top-2 text-slate-500 hover:text-slate-300 text-xs">
                ✕
              </button>
            </div>

            <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-0.5 text-xs shrink-0">
              <button @click="viewMode = 'cards'; saveState()"
                      :class="viewMode === 'cards' ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                      class="px-2 py-1 rounded-md transition text-[11px]">
                Cards
              </button>
              <button @click="viewMode = 'json'; saveState()"
                      :class="viewMode === 'json' ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                      class="px-2 py-1 rounded-md transition text-[11px] flex items-center gap-1">
                <span>{ }</span>
                <span>JSON</span>
              </button>
            </div>

            <div class="flex items-center bg-slate-950 border border-slate-800 rounded-lg p-0.5 text-xs shrink-0">
              <button @click="sortMode = 'order'; saveState()"
                      :class="sortMode === 'order' ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                      class="px-2 py-1 rounded-md transition text-[11px]">
                Order
              </button>
              <button @click="sortMode = 'alpha'; saveState()"
                      :class="sortMode === 'alpha' ? 'bg-indigo-600 text-white font-medium shadow-sm' : 'text-slate-400 hover:text-slate-200'"
                      class="px-2 py-1 rounded-md transition text-[11px]">
                A-Z
              </button>
            </div>
          </div>
        </div>

        <template x-if="errorMessage">
          <div class="p-4 bg-rose-950/40 border border-rose-800/60 text-rose-200 rounded-xl text-xs font-mono leading-relaxed flex items-start gap-2.5">
            <svg class="w-4 h-4 text-rose-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
            <span x-text="errorMessage"></span>
          </div>
        </template>

        <div id="resultsContainer" class="results-container space-y-3.5 overflow-y-auto custom-scrollbar pr-0.5" style="max-height: 820px;">
          <template x-if="results.length === 0 && !errorMessage">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center space-y-2">
              <div class="w-10 h-10 bg-slate-800/80 text-slate-500 rounded-full flex items-center justify-center mx-auto">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              </div>
              <p class="text-slate-400 text-sm font-medium">No parsing results available</p>
              <p class="text-slate-500 text-xs">Enter a Grok pattern and sample log text to display matching diagnostics.</p>
            </div>
          </template>

          <template x-if="results.length > 0 && filteredResults.length === 0">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-8 text-center space-y-1.5">
              <p class="text-slate-300 text-sm font-medium">No lines match current display filters</p>
              <p class="text-slate-500 text-xs" x-text="showUnmatchedOnly ? 'All lines matched successfully!' : 'Try adjusting search query filters.'"></p>
            </div>
          </template>

          <template x-for="res in filteredResults" :key="res.line_number">
            <div class="bg-slate-900 border rounded-xl p-4 transition-all space-y-3 shadow-sm"
                 :class="res.matched ? 'border-slate-800' : 'border-rose-900/40 bg-rose-950/10'">

              <div class="flex items-center justify-between text-xs pb-2 border-b border-slate-800/60">
                <div class="flex items-center gap-2 min-w-0">
                  <span class="font-bold font-mono"
                        :class="res.matched ? 'text-slate-400' : 'text-rose-300'">
                    #<span x-text="res.line_number"></span>
                  </span>
                  <span class="text-slate-600">•</span>
                  <span class="text-slate-400 text-[11px] truncate max-w-[200px] sm:max-w-xs" x-text="res.line_text"></span>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                  <template x-if="res.matched">
                    <button @click="res.showJson = !res.showJson"
                            class="px-2 py-0.5 rounded text-[10px] font-mono border transition flex items-center gap-1"
                            :class="res.showJson || viewMode === 'json' ? 'bg-indigo-950 text-indigo-300 border-indigo-700/80' : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-slate-200'">
                      <span>{ }</span>
                      <span>JSON</span>
                    </button>
                  </template>

                  <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider shrink-0"
                        :class="res.matched ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/80' : 'bg-rose-950 text-rose-400 border border-rose-800/80'"
                        x-text="res.matched ? 'Match' : 'No Match'"></span>
                </div>
              </div>

              <template x-if="res.matched">
                <div class="space-y-3">
                  <div class="font-mono text-xs break-all leading-relaxed p-3 bg-slate-950 rounded-lg border border-slate-800 overflow-x-auto custom-scrollbar">
                    <template x-for="(seg, idx) in res.segments" :key="idx">
                      <span>
                        <template x-if="seg.field">
                          <span :class="`${getFieldColor(seg.field).bg} ${getFieldColor(seg.field).text} ${getFieldColor(seg.field).border} px-1.5 py-0.5 rounded border font-semibold inline-block my-0.5`"
                                :title="seg.field"
                                x-text="seg.text"></span>
                        </template>
                        <template x-if="!seg.field">
                          <span class="text-slate-400" x-text="seg.text"></span>
                        </template>
                      </span>
                    </template>
                  </div>

                  <template x-if="!res.showJson && viewMode !== 'json'">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                      <template x-for="item in getDisplayFields(res)" :key="item.key">
                        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-950 border border-slate-800/80 text-xs font-mono min-w-0">
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold border shrink-0 mr-2 whitespace-nowrap"
                                :class="getFieldColor(item.key).badge"
                                x-text="item.key"></span>
                          <span class="text-slate-200 truncate font-sans text-right min-w-0" :title="item.value" x-text="item.value"></span>
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="res.showJson || viewMode === 'json'">
                    <div class="relative group pt-1">
                      <button @click="copyJson(res.json_data, $event)"
                              class="absolute top-3 right-3 px-2 py-1 bg-slate-900 hover:bg-slate-800 text-slate-300 text-[10px] font-mono rounded border border-slate-800 transition opacity-80 group-hover:opacity-100 flex items-center gap-1 shadow-sm">
                        <svg class="w-3 h-3 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 012-2v-8a2 2 0 01-2-2h-8a2 2 0 01-2 2v8a2 2 0 012 2z"/></svg>
                        <span>Copy JSON</span>
                      </button>
                      <pre class="bg-slate-950 border border-slate-800 rounded-lg p-3.5 font-mono text-xs text-indigo-200 overflow-x-auto leading-relaxed custom-scrollbar"><code x-text="formatJson(res.json_data)"></code></pre>
                    </div>
                  </template>
                </div>
              </template>

              <template x-if="!res.matched">
                <div class="space-y-3 pt-1">
                  <div class="text-xs text-rose-300 font-semibold flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
                    <span>Pattern Mismatch Breakdown:</span>
                  </div>

                  <template x-if="res.partial_match && res.partial_match.matched_prefix">
                    <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 space-y-2.5 text-xs font-mono">
                      <div>
                        <span class="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-1">Matched Grok Sub-string:</span>
                        <div class="text-emerald-400 bg-emerald-950/30 p-2 rounded-md border border-emerald-900/40 break-all" x-text="res.partial_match.matched_prefix"></div>
                      </div>

                      <div>
                        <span class="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-1">Point of Failure:</span>
                        <div class="p-2 bg-slate-900 rounded-md border border-slate-800 break-all">
                          <span class="text-slate-500" x-text="res.line_text.substring(0, res.line_text.length - res.partial_match.unmatched_remainder.length)"></span>
                          <span class="text-rose-400 bg-rose-950 px-1 py-0.5 rounded border border-rose-700 font-bold underline" x-text="res.partial_match.unmatched_remainder"></span>
                        </div>
                      </div>

                      <template x-if="Object.keys(res.partial_match.matched_fields).length > 0">
                        <div>
                          <span class="text-slate-500 uppercase tracking-wider text-[10px] font-bold block mb-1">Captured Before Failure:</span>
                          <div class="flex flex-wrap gap-1.5">
                            <template x-for="(val, key) in res.partial_match.matched_fields" :key="key">
                              <span class="px-2 py-0.5 rounded text-[10px] bg-slate-900 border border-slate-800 text-slate-300">
                                <strong x-text="key"></strong>: <span class="text-indigo-300" x-text="val"></span>
                              </span>
                            </template>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>

                  <template x-if="!res.partial_match || !res.partial_match.matched_prefix">
                    <div class="p-3 bg-slate-950 rounded-lg text-xs font-mono text-rose-400 border border-rose-900/30">
                      Failed matching at the first token of the log line.
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- Sample Log Lines -->
    <div class="mt-6">
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-sm space-y-2">
        <div class="flex items-center justify-between">
          <label class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
            <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            Sample Log Lines
          </label>
          <span class="text-[11px] font-mono text-slate-500" x-text="lineCount + ' lines'"></span>
        </div>

        <div class="relative bg-slate-950 border border-slate-800 rounded-lg overflow-hidden flex flex-col h-60 resize-y">
          <div class="flex flex-1 min-h-0">
            <div id="log_gutter" aria-hidden="true"
                 class="w-10 shrink-0 bg-slate-900/80 border-r border-slate-800 py-3 px-1 text-right font-mono text-xs select-none overflow-y-auto leading-relaxed custom-scrollbar"
                 :class="allLinesMatched ? 'text-slate-600' : 'text-rose-400/70'">
              <template x-for="(n, idx) in lineNumbers" :key="idx">
                <div :class="results[idx] && !results[idx].matched ? 'text-rose-400 font-semibold' : 'text-inherit'" x-text="n"></div>
              </template>
            </div>

            <textarea id="area_logs"
              x-model="logText"
              @input="onLogInput()"
              @scroll="syncScroll()"
              class="flex-1 bg-slate-950 py-3 px-3 font-mono text-xs text-slate-200 focus:outline-none leading-relaxed border-0 whitespace-pre resize-none custom-scrollbar"
              style="overflow-wrap: normal; word-break: normal;"
              :class="logLineClasses"
              placeholder="Paste target log lines here..."></textarea>
          </div>
          <div class="h-1 w-full bg-slate-800/50 hover:bg-slate-700/50 cursor-ns-resize shrink-0"></div>
        </div>
      </div>

  <script>
    const DEFAULT_PATTERN = '';
    const DEFAULT_LOGS = '';
    
    const PALETTE = [
      { bg: 'bg-indigo-500/20', text: 'text-indigo-300', border: 'border-indigo-500/30', badge: 'bg-indigo-950/80 text-indigo-300 border-indigo-700/60' },
      { bg: 'bg-emerald-500/20', text: 'text-emerald-300', border: 'border-emerald-500/30', badge: 'bg-emerald-950/80 text-emerald-300 border-emerald-700/60' },
      { bg: 'bg-amber-500/20', text: 'text-amber-300', border: 'border-amber-500/30', badge: 'bg-amber-950/80 text-amber-300 border-amber-700/60' },
      { bg: 'bg-pink-500/20', text: 'text-pink-300', border: 'border-pink-500/30', badge: 'bg-pink-950/80 text-pink-300 border-pink-700/60' },
      { bg: 'bg-purple-500/20', text: 'text-purple-300', border: 'border-purple-500/30', badge: 'bg-purple-950/80 text-purple-300 border-purple-700/60' },
      { bg: 'bg-cyan-500/20', text: 'text-cyan-300', border: 'border-cyan-500/30', badge: 'bg-cyan-950/80 text-cyan-300 border-cyan-700/60' },
      { bg: 'bg-orange-500/20', text: 'text-orange-300', border: 'border-orange-500/30', badge: 'bg-orange-950/80 text-orange-300 border-orange-700/60' },
      { bg: 'bg-teal-500/20', text: 'text-teal-300', border: 'border-teal-500/30', badge: 'bg-teal-950/80 text-teal-300 border-teal-700/60' },
      { bg: 'bg-rose-500/20', text: 'text-rose-300', border: 'border-rose-500/30', badge: 'bg-rose-950/80 text-rose-300 border-rose-700/60' },
      { bg: 'bg-lime-500/20', text: 'text-lime-300', border: 'border-lime-500/30', badge: 'bg-lime-950/80 text-lime-300 border-lime-700/60' },
      { bg: 'bg-fuchsia-500/20', text: 'text-fuchsia-300', border: 'border-fuchsia-500/30', badge: 'bg-fuchsia-950/80 text-fuchsia-300 border-fuchsia-700/60' },
      { bg: 'bg-sky-500/20', text: 'text-sky-300', border: 'border-sky-500/30', badge: 'bg-sky-950/80 text-sky-300 border-sky-700/60' },
      { bg: 'bg-violet-500/20', text: 'text-violet-300', border: 'border-violet-500/30', badge: 'bg-violet-950/80 text-violet-300 border-violet-700/60' },
    ];

    function grokApp() {
      return {
        appConfig: { 
          version: 'Loading...', 
          environment: 'development', 
          features: {
            enable_auto_generate: true
          } 
        },
        pattern: localStorage.getItem('grok_pattern') || DEFAULT_PATTERN,
        customPatterns: localStorage.getItem('grok_custom') || '',
        logText: localStorage.getItem('grok_log_text') || DEFAULT_LOGS,
        namingFormat: localStorage.getItem('grok_naming_format') || 'bracket',
        sortMode: localStorage.getItem('grok_sort_mode') || 'order',
        viewMode: localStorage.getItem('grok_view_mode') || 'cards',
        showUnmatchedOnly: localStorage.getItem('grok_unmatched_only') === 'true',
        searchQuery: '',
        liveMode: true,
        results: [],
        errorMessage: '',
        rawMatchText: '',
        suggestedFix: '',
        rawGroupToReplace: null,
        debounceTimer: null,
        fieldColorMap: {},
        inconsistentFields: [],

        get lineCount() {
          return this.logText ? this.logText.split('\n').length : 1;
        },

        get customLineCount() {
          return this.customPatterns ? this.customPatterns.split('\n').length : 1;
        },

        get matchedCount() {
          return this.results.filter(r => r.matched).length;
        },

        get allLinesMatched() {
          return this.results.length > 0 && this.results.every(r => r.matched);
        },

        get lineNumbers() {
          return Array.from({ length: this.lineCount }, (_, i) => i + 1);
        },

        get logLineClasses() {
          if (!this.results.length) return '';
          return this.results.every(r => r.matched)
            ? 'ring-0'
            : 'bg-[linear-gradient(to_bottom,rgba(127,29,29,0.10),rgba(127,29,29,0.10))]';
        },

        get filteredResults() {
          let list = this.results;

          if (this.showUnmatchedOnly) {
            list = list.filter(r => !r.matched);
          }

          if (this.searchQuery.trim()) {
            const q = this.searchQuery.toLowerCase();
            list = list.filter(r => {
              const lineMatch = r.line_text && r.line_text.toLowerCase().includes(q);
              const fieldMatch = r.matches && Object.entries(r.matches).some(([k, v]) =>
                k.toLowerCase().includes(q) || String(v).toLowerCase().includes(q)
              );
              return lineMatch || fieldMatch;
            });
          }

          return list;
        },

        initApp() {
          this.fetchConfig();
          this.checkSyntaxNotice();
          this.analyzeFormats();
          this.triggerMatch();
        },

        async fetchConfig() {
          try {
            const res = await fetch('/api/config');
            if (res.ok) {
              const data = await res.json();
              this.appConfig = { ...this.appConfig, ...data };
            }
          } catch (e) {
            console.warn('Unable to load server config, using defaults.', e);
          }
        },

        setNamingFormat(format) {
          this.namingFormat = format;
          this.analyzeFormats();
          this.saveState();
          this.onInputChange();
        },

        analyzeFormats() {
          const grokRegex = /%\{[^:]+:([^}:]+)(?::[^}]+)?\}/g;
          const namedGroupRegex = /\(\?(?:<|P<)([^>]+)>/g;
          
          let fields = [];
          let match;
          
          while ((match = grokRegex.exec(this.pattern)) !== null) {
            fields.push(match[1]);
          }
          while ((match = namedGroupRegex.exec(this.pattern)) !== null) {
            fields.push(match[1]);
          }
          
          let detectedInconsistent = [];
          
          fields.forEach(f => {
            const isDot = /^[a-zA-Z0-9_\-]+(\.[a-zA-Z0-9_\-]+)+$/.test(f);
            const isBracket = /^(\[[a-zA-Z0-9_\-]+\])+$/.test(f);
            
            if (this.namingFormat === 'dot' && isBracket) {
              detectedInconsistent.push(f);
            }
            if (this.namingFormat === 'bracket' && isDot) {
              detectedInconsistent.push(f);
            }
          });
          
          this.inconsistentFields = [...new Set(detectedInconsistent)];
        },

        normalizePattern() {
          let newPattern = this.pattern;
          
          const convertField = (fieldName) => {
            if (this.namingFormat === 'bracket') {
              if (/^[a-zA-Z0-9_\-]+(\.[a-zA-Z0-9_\-]+)+$/.test(fieldName)) {
                return fieldName.split('.').map(p => `[${p}]`).join('');
              }
            } else {
              if (/^(\[[a-zA-Z0-9_\-]+\])+$/.test(fieldName)) {
                return fieldName.replace(/^\[|\]$/g, '').split('][').join('.');
              }
            }
            return fieldName;
          };

          newPattern = newPattern.replace(/(%\{[^:]+:)([^}:]+)((?::[^}]+)?\})/g, (match, prefix, field, suffix) => {
            return prefix + convertField(field) + suffix;
          });
          
          newPattern = newPattern.replace(/(\(\?(?:<|P<))([^>]+)(>)/g, (match, prefix, field, suffix) => {
            return prefix + convertField(field) + suffix;
          });
          
          this.pattern = newPattern;
          this.analyzeFormats();
          this.onInputChange();
        },

        sortObjectKeys(obj) {
          if (obj === null || typeof obj !== 'object' || Array.isArray(obj)) {
            return obj;
          }
          return Object.keys(obj)
            .sort((a, b) => a.localeCompare(b))
            .reduce((acc, key) => {
              acc[key] = this.sortObjectKeys(obj[key]);
              return acc;
            }, {});
        },

        formatJson(obj) {
          if (!obj) return '{}';
          const target = this.sortMode === 'alpha' ? this.sortObjectKeys(obj) : obj;
          return JSON.stringify(target, null, 2);
        },

        async copyJson(obj, evt) {
          const text = this.formatJson(obj);
          await navigator.clipboard.writeText(text);
          const btn = evt.currentTarget;
          const orig = btn.innerHTML;
          btn.innerHTML = `<span class="text-emerald-400">Copied!</span>`;
          setTimeout(() => btn.innerHTML = orig, 1500);
        },

        syncResultsHeight() {
          this.$nextTick(() => {
            const customContainer = document.getElementById('customPatternsContainer');
            const resultsContainer = document.getElementById('resultsContainer');
            
            if (customContainer && resultsContainer) {
              const customHeight = customContainer.offsetHeight;
              const resultsHeight = resultsContainer.offsetHeight;
              
              if (customHeight > resultsHeight) {
                const newMaxHeight = Math.max(customHeight - 20, 400);
                resultsContainer.style.maxHeight = newMaxHeight + 'px';
              } else {
                resultsContainer.style.maxHeight = '820px';
              }
            }
          });
        },

        syncScroll() {
          const ta = document.getElementById('area_logs');
          const gutter = document.getElementById('log_gutter');
          if (ta && gutter) gutter.scrollTop = ta.scrollTop;
        },

        syncCustomScroll() {
          const ta = document.getElementById('area_custom');
          const gutter = document.getElementById('custom_gutter');
          if (ta && gutter) gutter.scrollTop = ta.scrollTop;
        },

        resetAll() {
          localStorage.clear();
          this.pattern = DEFAULT_PATTERN;
          this.customPatterns = '';
          this.logText = DEFAULT_LOGS;
          this.namingFormat = 'bracket';
          this.sortMode = 'order';
          this.viewMode = 'cards';
          this.showUnmatchedOnly = false;
          this.searchQuery = '';
          this.results = [];
          this.errorMessage = '';
          this.rawMatchText = '';
          this.suggestedFix = '';
          this.rawGroupToReplace = null;
          this.fieldColorMap = {};
          this.inconsistentFields = [];

          this.saveState();
          this.onInputChange();
        },

        getFieldColor(fieldName) {
          if (!fieldName) return PALETTE[0];
          
          if (this.fieldColorMap[fieldName]) {
            return this.fieldColorMap[fieldName];
          }
          
          const existingFields = Object.keys(this.fieldColorMap);
          const index = existingFields.length % PALETTE.length;
          const color = PALETTE[index];
          
          this.fieldColorMap[fieldName] = color;
          return color;
        },

        getDisplayFields(res) {
          if (!res || !res.matches) return [];
          if (this.sortMode === 'order' && res.ordered_matches && res.ordered_matches.length > 0) {
            return res.ordered_matches;
          }
          return Object.keys(res.matches).sort().map(k => ({ key: k, value: res.matches[k] }));
        },

        resolveRegexToGrok(regex) {
          const normalized = regex.trim();

          const mappings = [
            // Numbers
            { test: /^\\d\+$/, grok: 'INT' },
            { test: /^\[0-9\]\+$/, grok: 'INT' },
            { test: /^\\d\*\$/, grok: 'NUMBER' },
            { test: /^\[0-9\]\*\$/, grok: 'NUMBER' },

            // Words / text
            { test: /^\\w\+$/, grok: 'WORD' },
            { test: /^\\w\*$/, grok: 'WORD' },

            // Non whitespace
            { test: /^\\S\+$/, grok: 'NOTSPACE' },
            { test: /^\\S\*$/, grok: 'NOTSPACE' },

            // Whitespace
            { test: /^\\s\+$/, grok: 'SPACE' },
            { test: /^\\s\*$/, grok: 'SPACE' },

            // Any characters
            { test: /^\.\+$/, grok: 'GREEDYDATA' },
            { test: /^\.\*$/, grok: 'GREEDYDATA' },

            // IP addresses
            { 
              test: /^\(\?P?<[^>]+>.*\)$/,
              grok: 'IP'
            },

            // Hex
            { test: /^\\x[0-9a-fA-F]+$/, grok: 'BASE16NUM' },

            // UUID
            { 
              test: /^[0-9a-fA-F-]{36}$/,
              grok: 'UUID'
            },

            // Quoted strings
            {
              test: /^".*"$/,
              grok: 'QUOTEDSTRING'
            }
          ];

          const found = mappings.find(item => item.test.test(normalized));

          return found ? found.grok : 'GREEDYDATA';
        },

        checkSyntaxNotice() {
          const match = this.pattern.match(/\(\?(?:P)?<([^>]+)>([^)]*)\)/);
          if (match) {
            const rawGroup = match[0];
            const fieldName = match[1];
            const innerRegex = match[2];

            this.rawGroupToReplace = rawGroup;
            this.rawMatchText = rawGroup;

            const grokPattern = this.resolveRegexToGrok(innerRegex);

            this.suggestedFix = `%{${grokPattern}:${fieldName}}`;
          } else {
            this.suggestedFix = '';
            this.rawGroupToReplace = null;
            this.rawMatchText = '';
          }
        },

        applyAutoFix() {
          if (this.rawGroupToReplace && this.suggestedFix) {
            this.pattern = this.pattern.replace(this.rawGroupToReplace, this.suggestedFix);
            this.onInputChange();
          }
        },

        strictMode: localStorage.getItem('grok_strict_mode') === 'true',

        saveState() {
          localStorage.setItem('grok_pattern', this.pattern);
          localStorage.setItem('grok_custom', this.customPatterns);
          localStorage.setItem('grok_log_text', this.logText);
          localStorage.setItem('grok_naming_format', this.namingFormat);
          localStorage.setItem('grok_sort_mode', this.sortMode);
          localStorage.setItem('grok_view_mode', this.viewMode);
          localStorage.setItem('grok_unmatched_only', String(this.showUnmatchedOnly));
          localStorage.setItem('grok_strict_mode', String(this.strictMode));
        },

        onLogInput() {
          this.saveState();
          this.onInputChange();
        },

        onInputChange() {
          this.saveState();
          this.checkSyntaxNotice();
          this.analyzeFormats();

          if (!this.liveMode) return;

          clearTimeout(this.debounceTimer);
          this.debounceTimer = setTimeout(() => {
            this.triggerMatch();
          }, 300);
        },

        async triggerMatch() {
          this.errorMessage = '';
          try {
            const res = await fetch('/api/match', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                pattern: this.pattern,
                custom_patterns: this.customPatterns,
                log_text: this.logText,
                naming_format: this.namingFormat,
                strict_mode: this.strictMode
              })
            });
            const data = await res.json();
            if (data.success) {
              this.results = (data.results || []).map(r => ({ ...r, showJson: false }));
              this.fieldColorMap = {};
              this.$nextTick(() => {
                this.syncResultsHeight();
              });
            } else {
              this.errorMessage = data.detail || 'Unknown matching error.';
              this.results = [];
            }
          } catch (err) {
            this.errorMessage = 'Failed to communicate with server backend.';
            this.results = [];
          }
        },

        async autoGenerate() {
          try {
            const res = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                pattern: '',
                custom_patterns: '',
                log_text: this.logText,
                naming_format: this.namingFormat
              })
            });
            const data = await res.json();
            if (data.success) {
              this.pattern = data.generated_pattern || '';
              this.onInputChange();
            }
          } catch (e) {
            console.error(e);
          }
        }
      }
    }
  </script>
</body>
</html>
