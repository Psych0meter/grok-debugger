[project]
name = "grok-regex-debugger"
version = "1.1.4"
description = "ECS-compliant Grok & Regexp Debugger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "jinja2>=3.1.0",
    "pygrok>=1.0.0",
    "pydantic>=2.0.0"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F/W: pyflakes + pycodestyle (default). B: bugbear. C4: comprehensions.
# SIM: simplify. UP: pyupgrade. RUF: ruff-native checks. PTH: prefer pathlib.
# N: naming. ARG: unused arguments. BLE: no bare `except Exception` without
# a justifying comment/noqa (see grok_engine.py's find_partial_match).
select = ["E", "F", "W", "B", "C4", "SIM", "UP", "RUF", "PTH", "N", "ARG", "BLE"]
